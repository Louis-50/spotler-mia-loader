<!-- Modal overlay for the HubSpot calendar -->
<div id="hubspot-modal" style="
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.5); z-index:2147483647;
  align-items:center; justify-content:center;
  overflow:hidden;
  padding:16px; box-sizing:border-box;">
  <div id="hubspot-modal-card" style="
    width:min(860px, calc(100vw - 24px));
    height:min(720px, calc(100dvh - 24px));
    border-radius:10px; position:relative;
    overflow:hidden; background:#ffffff;
    box-shadow:0 18px 50px rgba(0,0,0,0.22);">
    <button
      onclick="if (window.spotlerCloseHubSpotModal) window.spotlerCloseHubSpotModal();"
      style="position:absolute; top:12px; right:12px; width:36px; height:36px;
             font-size:20px; border:none; background:rgba(0,0,0,0.55); color:#fff;
             border-radius:50%; cursor:pointer; line-height:1; z-index:20;
             display:flex; align-items:center; justify-content:center;
             box-shadow:0 2px 6px rgba(0,0,0,0.25);"
      aria-label="Close">&times;</button>
    <div id="hubspot-loading" style="
      position:absolute; inset:0; display:flex;
      align-items:center; justify-content:center;
      background:#f5f8fa; z-index:5; border-radius:10px;">
      <div style="width:40px; height:40px; border:3px solid #e0e0e0;
                  border-top-color:#0073b1; border-radius:50%;
                  animation:hs-spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes hs-spin { to { transform: rotate(360deg); } }

      #hubspot-meeting-container,
      #hubspot-iframe-stage {
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        overflow:hidden !important;
        background:#ffffff;
      }

      #hubspot-iframe-stage iframe {
        display:block;
        position:absolute;
        /* HubSpot's embedded page adds its own ~16px outer gutter. Because the
           iframe is cross-origin we cannot remove that gutter with CSS inside
           HubSpot, so crop it at the stage instead. This makes the scheduler
           sit flush to our rounded modal edge rather than looking like it has
           a thick white border. */
        top:-16px;
        left:-16px;
        width:calc(100% + 32px) !important;
        max-width:none !important;
        height:calc(100% + 32px) !important;
        margin:0;
        padding:0;
        border:0 !important;
        background:#ffffff;
      }

      /* HubSpot's meetings widget normally expects roughly a 715px iframe.
         Give it that space on normal screens so the sticky Confirm/Request
         footer is fully inside the iframe. On shorter laptops we use the
         available viewport. The iframe document can still scroll when needed,
         but its own scrollbar is clipped off-screen so only HubSpot's form
         scrollbar is visible. We do not scale the scheduler. */
      @media (max-height: 744px) {
        #hubspot-modal { padding:8px !important; }
        #hubspot-modal-card {
          width:min(860px, calc(100vw - 16px)) !important;
          height:calc(100dvh - 16px) !important;
        }
      }

      @supports not (height: 100dvh) {
        #hubspot-modal-card { height:min(720px, calc(100vh - 24px)) !important; }
        @media (max-height: 744px) {
          #hubspot-modal-card { height:calc(100vh - 16px) !important; }
        }
      }
    </style>
    <div id="hubspot-meeting-container">
      <div id="hubspot-iframe-stage"></div>
    </div>
  </div>
</div>
